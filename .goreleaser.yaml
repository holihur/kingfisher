# goreleaser 发布配置：构建后端二进制 + 打包前端 dist，上传 GitHub Release。
# 产物布局与 deploy.sh 的 Release 拉取一致：
#   kingfisher-server        （后端二进制）
#   kingfisher-web/          （前端 dist）
#   config.yaml              （生产配置模板）
version: 2

project_name: kingfisher

# 发布前构建前端 dist（dist 在 gitignore，须先构建）
before:
  hooks:
    - sh -c "cd kingfisher-web && corepack enable && pnpm install --frozen-lockfile && pnpm build"

builds:
  - id: server
    main: ./cmd/server
    binary: kingfisher-server
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.buildTime={{.Date}}

# 归档：
# 1) 所有平台：裸可执行文件（formats: binary）——每个平台一个文件
# 2) linux/amd64：额外打包前端 dist + 生产配置，供 101 机器部署（deploy.sh 拉取）
archives:
  - id: binaries
    formats: [binary]
    name_template: "kingfisher-server_{{ .Os }}_{{ .Arch }}"
    meta: false

  - id: deploy
    formats: [tar.gz]
    name_template: "kingfisher-deploy_{{ .Os }}_{{ .Arch }}"
    # 每个平台一个部署包（含二进制 + dist + config）；部署用 linux_amd64
    files:
      - src: deploy/config.prod.yaml
        dst: config.yaml
      - src: kingfisher-web/dist/*
        dst: kingfisher-web
        strip_parent: false
    meta: false

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
