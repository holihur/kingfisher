server:
  port: 8080
  mode: debug
  read_timeout: 10s
  write_timeout: 10s
  max_request_body: 10MB
  trusted_proxies:
    - "127.0.0.1"
    - "10.0.0.0/8"

database:
  driver: sqlite
  sqlite:
    path: kingfisher.db
  # driver: mysql  # 生产切换
  # mysql:
  #   host: 127.0.0.1
  #   port: 3306
  #   database: kingfisher
  #   charset: utf8mb4
  #   max_idle_conns: 10
  #   max_open_conns: 100
  #   conn_max_lifetime: 1h
  # driver: postgres
  # postgres:
  #   host: 127.0.0.1
  #   port: 5432
  #   database: kingfisher
  #   sslmode: disable

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  pool_size: 20

jwt:
  access_ttl: 2h
  refresh_ttl: 168h
  issuer: kingfisher
  secret: "change-me-in-production"

log:
  level: debug
  format: console
  output: stdout
  file_path: logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30

taskqueue:
  enabled: true
  concurrency: 10

rate_limit:
  enabled: true
  requests_per_minute: 60
  login_per_minute: 5

cors:
  allowed_origins:
    - http://localhost:5173
  allowed_methods: ["GET","POST","PUT","DELETE","OPTIONS"]
  allowed_headers: ["Authorization","Content-Type","X-Request-ID"]
  allow_credentials: true
  max_age: 12h
