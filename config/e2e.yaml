server:
  port: 18080
  mode: test
  read_timeout: 30s
  write_timeout: 30s

database:
  driver: sqlite
  sqlite:
    path: /tmp/kingfisher-e2e.db

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 1
  pool_size: 5

jwt:
  access_ttl: 3600h
  refresh_ttl: 7200h
  issuer: kingfisher-e2e
  secret: "e2e-test-secret-jwt-key-2024"

log:
  level: error
  format: console
  output: stderr

taskqueue:
  enabled: true
  concurrency: 4
  periodic_sync_interval: 60

rate_limit:
  enabled: true
  requests_per_minute: 300
  login_per_minute: 5

cors:
  allowed_origins:
    - http://localhost:15173
    - http://localhost:5173
  allowed_methods: ["GET","POST","PUT","DELETE","OPTIONS"]
  allowed_headers: ["Authorization","Content-Type","X-Request-ID"]
  allow_credentials: true
  max_age: 12h
