name: Release
# 独立发布 workflow：tag v* 时用 goreleaser 构建产物并上传 GitHub Release。
# 与 CI（lint/test/build/e2e）分离，可单独触发、单独调试。
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # goreleaser 需要完整 git 历史生成 changelog
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # 显式激活 corepack 安装 pnpm（goreleaser before hook 里构建前端会用到）
      - name: 激活 pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      # 用 goreleaser 构建 + 打包 + 上传 Release
      - name: 运行 goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
