name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
      - run: bash scripts/check-guardrails.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go test -v -race -count=1 ./...
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: go build -ldflags="-s -w -X main.version=$(git describe --tags --always 2>/dev/null || echo dev) -X main.commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o bin/server ./cmd/server
  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm', cache-dependency-path: 'kingfisher-web/pnpm-lock.yaml' }
      # corepack enable 后，首次调用 pnpm 会按 packageManager 字段自动安装锁定版本
      - run: corepack enable
      - run: cd kingfisher-web && pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: go install github.com/go-task/task/v3/cmd/task@latest
      - run: task test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test/e2e/playwright-report/

  # 发布：tag v* 触发，构建前端 dist + 后端二进制，打包上传 GitHub Release
  release:
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm', cache-dependency-path: 'kingfisher-web/pnpm-lock.yaml' }
      - run: corepack enable
      # 后端二进制（linux/amd64，静态编译）
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=$(git rev-parse --short HEAD) -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o kingfisher-server ./cmd/server
      # 前端 dist
      - run: cd kingfisher-web && pnpm install --frozen-lockfile
      - run: cd kingfisher-web && pnpm build
      # 打包：server 二进制 + 前端 dist + 生产配置模板
      - name: 打包产物
        run: |
          mkdir -p release/kingfisher-web
          cp kingfisher-server release/
          cp -r kingfisher-web/dist/* release/kingfisher-web/
          cp deploy/config.prod.yaml release/config.yaml
          tar -C release -czf kingfisher-release.tar.gz .
      - name: 上传 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: kingfisher-release.tar.gz
          generate_release_notes: true
