name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
      - run: bash scripts/check-guardrails.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go test -v -race -count=1 ./...
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: go build -ldflags="-s -w -X main.version=$(git describe --tags --always 2>/dev/null || echo dev) -X main.commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o bin/server ./cmd/server
  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm', cache-dependency-path: 'kingfisher-web/pnpm-lock.yaml' }
      # corepack enable 后，首次调用 pnpm 会按 packageManager 字段自动安装锁定版本
      - run: corepack enable
      - run: cd kingfisher-web && pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: go install github.com/go-task/task/v3/cmd/task@latest
      - run: task test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test/e2e/playwright-report/
