basePath: /api/v1
definitions:
  extends_agent_transport.ChatStreamReq:
    properties:
      content:
        type: string
      conversation_id:
        type: integer
    type: object
  extends_agent_transport.CreateConversationReq:
    properties:
      title:
        type: string
    type: object
  extends_department_transport.AssignRolesReq:
    properties:
      role_ids:
        items:
          type: integer
        type: array
    required:
    - role_ids
    type: object
  extends_department_transport.CreateDeptReq:
    properties:
      name:
        example: 技术部
        type: string
      parent_id:
        type: integer
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
    required:
    - name
    type: object
  extends_department_transport.UpdateDeptReq:
    properties:
      name:
        type: string
      parent_id:
        type: integer
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
    type: object
  extends_dict_transport.DictEntryReq:
    properties:
      label:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
      value:
        type: string
      version:
        type: string
    required:
    - label
    - value
    type: object
  extends_dict_transport.DictTypeReq:
    properties:
      code:
        type: string
      is_public:
        type: boolean
      name:
        type: string
      remark:
        type: string
      status:
        type: integer
      version:
        type: string
    required:
    - code
    - name
    type: object
  extends_user_transport.BatchStatusReq:
    properties:
      ids:
        items:
          type: integer
        type: array
      status:
        example: 1
        type: integer
    required:
    - ids
    - status
    type: object
  extends_user_transport.BatchUserOp:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  extends_user_transport.ChangePwdReq:
    properties:
      new_password:
        example: NewPass123
        maxLength: 64
        minLength: 8
        type: string
      old_password:
        example: Abcd1234
        type: string
    required:
    - new_password
    - old_password
    type: object
  extends_user_transport.CreateUserReq:
    properties:
      dept_ids:
        items:
          type: integer
        type: array
      email:
        example: user@example.com
        type: string
      password:
        example: Abcd1234
        maxLength: 64
        minLength: 8
        type: string
      role_ids:
        items:
          type: integer
        type: array
      username:
        example: newuser
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  extends_user_transport.ForgotPasswordReq:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  extends_user_transport.LoginReq:
    properties:
      password:
        example: Abcd1234
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  extends_user_transport.LoginResp:
    properties:
      access_token:
        type: string
      landing_page:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/kingfisher_extends_user_domain.User'
    type: object
  extends_user_transport.RefreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  extends_user_transport.RegisterReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: Abcd1234
        maxLength: 64
        minLength: 8
        type: string
      username:
        example: newuser
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  extends_user_transport.ResetPasswordReq:
    properties:
      new_password:
        example: NewPass123
        maxLength: 64
        minLength: 8
        type: string
      token:
        example: abc123
        type: string
    required:
    - new_password
    - token
    type: object
  extends_user_transport.UpdateMeReq:
    properties:
      avatar:
        type: string
      email:
        example: admin@example.com
        type: string
      nickname:
        example: 管理员
        type: string
    type: object
  extends_user_transport.UpdateUserReq:
    properties:
      dept_ids:
        items:
          type: integer
        type: array
      email:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      status:
        type: integer
    type: object
  kingfisher_core_response.PageData:
    properties:
      items: {}
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  kingfisher_core_response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  kingfisher_extends_department_domain.Department:
    properties:
      children:
        items:
          $ref: '#/definitions/kingfisher_extends_department_domain.Department'
        type: array
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        description: 0=根
        type: integer
      remark:
        type: string
      role_ids:
        description: 部门直接挂载的角色 ID
        items:
          type: integer
        type: array
      roles:
        description: 部门挂载的角色详情
        items:
          $ref: '#/definitions/kingfisher_extends_department_domain.Role'
        type: array
      sort:
        type: integer
      status:
        description: 1=启用 0=停用
        type: integer
      updated_at:
        type: string
    type: object
  kingfisher_extends_department_domain.Role:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  kingfisher_extends_doc_domain.DocDirectory:
    properties:
      children:
        items:
          $ref: '#/definitions/kingfisher_extends_doc_domain.DocDirectory'
        type: array
      created_at:
        type: string
      docs:
        description: 该目录下当前用户可见的文档（叶子节点）
        items:
          $ref: '#/definitions/kingfisher_extends_doc_domain.DocTreeItem'
        type: array
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
      version:
        type: string
      visibility:
        description: shared | private
        type: string
    type: object
  kingfisher_extends_doc_domain.DocTreeItem:
    properties:
      id:
        type: integer
      status:
        type: string
      title:
        type: string
      visibility:
        type: string
    type: object
  kingfisher_extends_user_domain.Department:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  kingfisher_extends_user_domain.Role:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  kingfisher_extends_user_domain.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      departments:
        items:
          $ref: '#/definitions/kingfisher_extends_user_domain.Department'
        type: array
      dept_ids:
        items:
          type: integer
        type: array
      direct_role_ids:
        description: DirectRoleIDs 直接分配的角色（user_roles），供编辑表单回填；部门继承角色不在其中
        items:
          type: integer
        type: array
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      role_ids:
        description: RoleIDs/Roles 为「有效角色」= 直接分配 ∪ 部门继承（查询时合并，去重）
        items:
          type: integer
        type: array
      roles:
        items:
          $ref: '#/definitions/kingfisher_extends_user_domain.Role'
        type: array
      status:
        description: 1=启用 0=禁用
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 后台管理系统 API 文档
  title: Kingfisher Admin API
  version: "1.0"
paths:
  /agent/chat/stream:
    post:
      consumes:
      - application/json
      description: 发送一条消息并流式接收回复（text/event-stream）。事件：start/text_delta/tool_use/tool_result/done/error
      parameters:
      - description: 对话请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_agent_transport.ChatStreamReq'
      produces:
      - text/event-stream
      responses: {}
      security:
      - BearerAuth: []
      summary: 流式对话
      tags:
      - Agent
  /agent/conversations:
    get:
      description: 当前登录用户的 Agent 会话列表（按最近活跃倒序）
      produces:
      - application/json
      responses:
        "200":
          description: 会话列表
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "11001":
          description: 未启用
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 会话列表
      tags:
      - Agent
    post:
      consumes:
      - application/json
      description: 新建一个 Agent 会话（title 可选，留空用首条消息自动命名）
      parameters:
      - description: 创建请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_agent_transport.CreateConversationReq'
      produces:
      - application/json
      responses:
        "200":
          description: 会话
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "11001":
          description: 未启用
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 创建会话
      tags:
      - Agent
  /agent/conversations/{id}:
    delete:
      description: 删除会话及其全部消息
      parameters:
      - description: 会话ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "11002":
          description: 会话不存在
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 删除会话
      tags:
      - Agent
  /agent/conversations/{id}/messages:
    get:
      description: 某会话的消息记录（按时间正序）
      parameters:
      - description: 会话ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 消息列表
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "11002":
          description: 会话不存在
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 消息历史
      tags:
      - Agent
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 按邮箱发送密码重置邮件（含一次性 token 链接）。防枚举：邮箱不存在也返回成功
      parameters:
      - description: 找回密码请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.ForgotPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 邮件已发送
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      summary: 找回密码
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录，成功后返回 access/refresh token
      parameters:
      - description: 登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/extends_user_transport.LoginResp'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10103":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      summary: 用户登录
      tags:
      - Auth
  /auth/logout:
    post:
      description: 撤销当前 Bearer token
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh_token 换取新的 access_token
      parameters:
      - description: 刷新请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  properties:
                    access_token:
                      type: string
                  type: object
              type: object
        "10105":
          description: Token 无效
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      summary: 刷新Token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 使用用户名、密码、邮箱注册新账号；受注册开关控制
      parameters:
      - description: 注册请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/kingfisher_extends_user_domain.User'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10101":
          description: 用户已存在
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      summary: 用户注册
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: 用邮件中的一次性 token 设置新密码，并使旧 session 失效
      parameters:
      - description: 重置密码请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.ResetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 密码已重置
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "400":
          description: 参数错误或 token 无效
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      summary: 重置密码
      tags:
      - Auth
  /config-groups:
    get:
      responses: {}
      summary: 配置分组列表
      tags:
      - Config
  /configs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 配置列表
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 配置列表
      tags:
      - Config
  /configs/upload-image:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 图片文件（png/jpg/jpeg/gif/webp，≤2MB）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  properties:
                    url:
                      type: string
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 上传配置图片
      tags:
      - Config
  /departments:
    get:
      description: 分页部门列表；filter 支持 subtree_id（某部门及其子孙）、parent_id、status、q=名称搜索
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 关键词（搜索名称）
        in: query
        name: q
        type: string
      - description: 筛选 JSON，如 {\
        in: query
        name: filter
        type: string
      - default: -id
        description: 排序
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 部门列表
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/kingfisher_core_response.PageData'
              type: object
      security:
      - BearerAuth: []
      summary: 部门列表（分页）
      tags:
      - Department
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_department_transport.CreateDeptReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/kingfisher_extends_department_domain.Department'
              type: object
      security:
      - BearerAuth: []
      summary: 创建部门
      tags:
      - Department
  /departments/{id}:
    delete:
      description: 有子部门时拒绝删除（返回 10902）
      parameters:
      - description: 部门ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10902":
          description: 存在子部门，不可删除
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 删除部门
      tags:
      - Department
    get:
      description: 返回单个部门（含挂载的角色）
      parameters:
      - description: 部门ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 部门详情
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/kingfisher_extends_department_domain.Department'
              type: object
        "10901":
          description: 部门不存在
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 部门详情
      tags:
      - Department
    put:
      consumes:
      - application/json
      parameters:
      - description: 部门ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_department_transport.UpdateDeptReq'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 更新部门
      tags:
      - Department
  /departments/{id}/roles:
    put:
      consumes:
      - application/json
      description: 全量替换部门的角色关联（部门角色会合并进成员用户的有效权限）
      parameters:
      - description: 部门ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色ID列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_department_transport.AssignRolesReq'
      produces:
      - application/json
      responses:
        "200":
          description: 分配成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 分配部门角色
      tags:
      - Department
  /departments/tree:
    get:
      description: 返回全部部门树（含每个部门挂载的角色）
      produces:
      - application/json
      responses:
        "200":
          description: 部门树
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/kingfisher_extends_department_domain.Department'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 部门树
      tags:
      - Department
  /dict-types:
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_dict_transport.DictTypeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "400":
          description: 参数错误
