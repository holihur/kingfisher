basePath: /api/v1
definitions:
  extends_dict_transport.DictEntryReq:
    properties:
      label:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
      value:
        type: string
      version:
        type: string
    required:
    - label
    - value
    type: object
  extends_dict_transport.DictTypeReq:
    properties:
      code:
        type: string
      is_public:
        type: boolean
      name:
        type: string
      remark:
        type: string
      status:
        type: integer
      version:
        type: string
    required:
    - code
    - name
    type: object
  extends_user_transport.BatchStatusReq:
    properties:
      ids:
        items:
          type: integer
        type: array
      status:
        example: 1
        type: integer
    required:
    - ids
    - status
    type: object
  extends_user_transport.BatchUserOp:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  extends_user_transport.ChangePwdReq:
    properties:
      new_password:
        example: NewPass123
        maxLength: 64
        minLength: 8
        type: string
      old_password:
        example: Abcd1234
        type: string
    required:
    - new_password
    - old_password
    type: object
  extends_user_transport.CreateUserReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: Abcd1234
        maxLength: 64
        minLength: 8
        type: string
      role_ids:
        items:
          type: integer
        type: array
      username:
        example: newuser
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  extends_user_transport.LoginReq:
    properties:
      password:
        example: Abcd1234
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  extends_user_transport.LoginResp:
    properties:
      access_token:
        type: string
      landing_page:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/kingfisher_extends_user_domain.User'
    type: object
  extends_user_transport.RefreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  extends_user_transport.RegisterReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: Abcd1234
        maxLength: 64
        minLength: 8
        type: string
      username:
        example: newuser
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  extends_user_transport.UpdateMeReq:
    properties:
      avatar:
        type: string
      email:
        example: admin@example.com
        type: string
      nickname:
        example: 管理员
        type: string
    type: object
  extends_user_transport.UpdateUserReq:
    properties:
      email:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      status:
        type: integer
    type: object
  kingfisher_core_response.PageData:
    properties:
      items: {}
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  kingfisher_core_response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  kingfisher_extends_user_domain.Role:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  kingfisher_extends_user_domain.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      roles:
        items:
          $ref: '#/definitions/kingfisher_extends_user_domain.Role'
        type: array
      status:
        description: 1=启用 0=禁用
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 后台管理系统 API 文档
  title: Kingfisher Admin API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录，成功后返回 access/refresh token
      parameters:
      - description: 登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/extends_user_transport.LoginResp'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10103":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      summary: 用户登录
      tags:
      - Auth
  /auth/logout:
    post:
      description: 撤销当前 Bearer token
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh_token 换取新的 access_token
      parameters:
      - description: 刷新请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  properties:
                    access_token:
                      type: string
                  type: object
              type: object
        "10105":
          description: Token 无效
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      summary: 刷新Token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 使用用户名、密码、邮箱注册新账号；受注册开关控制
      parameters:
      - description: 注册请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/kingfisher_extends_user_domain.User'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10101":
          description: 用户已存在
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      summary: 用户注册
      tags:
      - Auth
  /config-groups:
    get:
      responses: {}
      summary: 配置分组列表
      tags:
      - Config
  /configs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 配置列表
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 配置列表
      tags:
      - Config
  /configs/upload-image:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 图片文件（png/jpg/jpeg/gif/webp，≤2MB）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  properties:
                    url:
                      type: string
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 上传配置图片
      tags:
      - Config
  /dict-types:
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_dict_transport.DictTypeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10502":
          description: 编码已存在
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 创建字典类型
      tags:
      - Dict
  /dict-types/:id:
    delete:
      parameters:
      - description: 类型ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
