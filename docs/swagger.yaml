            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - User
  /users/me/permissions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 权限代码列表
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取当前用户权限列表
      tags:
      - User
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
