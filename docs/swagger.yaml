      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 踢下线
      tags:
      - User
  /users/batch-delete:
    post:
      consumes:
      - application/json
      description: 软删除多个用户
      parameters:
      - description: 批量删除请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.BatchUserOp'
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 批量删除用户
      tags:
      - User
  /users/batch-status:
    post:
      consumes:
      - application/json
      description: 批量启用/禁用用户
      parameters:
      - description: 批量更新请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.BatchStatusReq'
      produces:
      - application/json
      responses:
