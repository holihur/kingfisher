  /users:
    get:
      description: 查询用户列表，支持关键词搜索和字段过滤
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 关键词（搜索 username/email）
        in: query
        name: q
        type: string
      - default: -created_at
        description: 排序
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 用户列表
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/kingfisher_core_response.PageData'
              type: object
      security:
      - BearerAuth: []
      summary: 用户列表（分页）
      tags:
      - User
    post:
      consumes:
      - application/json
      description: 管理员创建新用户，可指定多个角色（role_ids）
      parameters:
      - description: 创建请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.CreateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/kingfisher_extends_user_domain.User'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10101":
          description: 用户已存在
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - User
  /users/{id}:
    delete:
      description: 软删除指定用户（不可删除自己）
      parameters:
