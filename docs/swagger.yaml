            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/kingfisher_extends_user_domain.User'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 更新个人资料
      tags:
      - User
  /users/me/avatar:
    post:
      consumes:
      - multipart/form-data
      description: 上传当前用户的头像图片（png/jpg/jpeg/gif/webp，最大 2MB）
      parameters:
      - description: 头像图片
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 头像URL
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  properties:
                    url:
                      type: string
                  type: object
              type: object
        "400":
          description: 文件类型或大小不符合要求
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 上传头像
      tags:
      - User
  /users/me/login-logs:
    get:
      description: 查询当前用户的历史登录记录（分页）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - default: -created_at
        description: 排序
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 登录日志列表
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/kingfisher_core_response.PageData'
              type: object
      security:
      - BearerAuth: []
      summary: 我的登录日志
      tags:
      - User
  /users/me/password:
    put:
      consumes:
      - application/json
      description: 当前用户修改自己的登录密码
      parameters:
      - description: 修改密码请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/extends_user_transport.ChangePwdReq'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10103":
          description: 旧密码错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - User
  /users/me/permissions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 权限代码列表
          schema:
            allOf:
            - $ref: '#/definitions/kingfisher_core_response.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取当前用户权限列表
      tags:
      - User
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
