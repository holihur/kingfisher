          description: 删除成功
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10504":
          description: 存在条目不可删除
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 删除字典类型
      tags:
      - Dict
    get:
      parameters:
      - description: 类型ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 字典类型详情
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
        "10501":
          description: 字典类型不存在
          schema:
            $ref: '#/definitions/kingfisher_core_response.Response'
      security:
      - BearerAuth: []
      summary: 字典类型详情
