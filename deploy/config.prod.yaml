# 生产配置模板 — 部署脚本会生成到机器上
# JWT_SECRET 由 systemd 环境变量注入（不能含占位值，release 模式强制要求）
server:
  port: 8090
  mode: release
  read_timeout: 10s
  write_timeout: 30s
  max_request_body: 10MB
  trusted_proxies:
    - "127.0.0.1"
  # 前端构建产物（Release 包内，与 server 同目录层级）
  static_dir: "/root/kingfisher/kingfisher-web"

database:
  driver: sqlite
  sqlite:
    path: /root/kingfisher/kingfisher.db

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  pool_size: 20

jwt:
  access_ttl: 2h
  refresh_ttl: 168h
  issuer: kingfisher
  # 生产必须通过环境变量 JWT_SECRET 覆盖
  secret: "change-me-in-production"

log:
  level: info
  format: console
  output: stdout
  file_path: /root/kingfisher/logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30

taskqueue:
  enabled: true
  concurrency: 4
  periodic_sync_interval: 60

rate_limit:
  enabled: true
  requests_per_minute: 60
  login_per_minute: 5

cors:
  allowed_origins:
    - "http://47.95.200.101:8090"
  allowed_methods: ["GET","POST","PUT","DELETE","OPTIONS"]
  allowed_headers: ["Authorization","Content-Type","X-Request-ID"]
  allow_credentials: true
  max_age: 12h
